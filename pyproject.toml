[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hotcache"
version = "0.1.0"
description = "Adaptive load-aware caching middleware for FastAPI with atomic Redis Lua engine, stampede locking, and stale-while-revalidate"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Avadhesh Nagar" }
]
dependencies = [
    "fastapi>=0.100.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "fakeredis[lua]>=2.20.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
demo = [
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "fakeredis[lua]>=2.20.0",
]

[tool.setuptools.packages.find]
include = ["hotcache*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
